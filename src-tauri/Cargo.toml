[package]
name = "worldsend-launcher"
version = "1.0.0"
description = "Project World's End — Minecraft Launcher"
authors = ["Project World's End"]
edition = "2021"

[lib]
name = "worldsend_launcher_lib"
crate-type = ["staticlib", "cdylib", "lib"]

[[bin]]
name = "worldsend-launcher"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-store = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
tokio = { version = "1", features = ["full"] }
sha2 = "0.10"
hex = "0.4"
dirs = "5"
futures-util = "0.3"
anyhow = "1"
thiserror = "1"
zip = "2"
flate2 = "1"
tar = "0.4"
sysinfo = "0.32"

[features]
custom-protocol = ["tauri/custom-protocol"]
